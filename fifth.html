
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fifth Bloom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="header-container">

            <a href="#" class="logo">
                <img src="./assets/Fifth.png" alt="Logo Fifth Bloom" width="80">

                <span class="logo-text">
                    <span class="logo-title">Fifth Bloom</span>
                    <span class="logo-subtitle">Marca de Cosméticos</span>
                </span>
            </a>

            <nav class="main-nav">
                <a href="#" class="nav-link">Início</a>
                <a href="./produtos.html" class="nav-link">Produtos</a>
                <a href="#" class="nav-link">Lançamentos</a>
                <a href="fifth.html" class="nav-link">Promoções</a>
            </nav>

            <div class="header-actions">
                <div class="search-box">
                    <input type="text" placeholder="Buscar produtos...">
                    <img
                        class="search-icon"
                        src="./assets/image.png"
                        alt="Ícone de pesquisa"
                    >
                </div>

                <button class="btn-primary" type="button">
                    Começar agora
                </button>

                <button id="btn-tema" type="button">
                    Alternar tema
                </button>
            </div>

            <button class="hamburguer" id="btn-menu" type="button">
                ☰ Menu
            </button>

        </div>
    </header>

    <script src="js/script.js"></script>
</body>
</html>
